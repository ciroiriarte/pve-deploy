---
- name: Check Redfish service availability.
  community.general.redfish_info:
    category:
      - Service
    command:
      - CheckAvailability
    baseuri: "{{ ansible_host }}"
    username: "{{ bmc_username }}"
    password: "{{ bmc_password }}"
    timeout: "{{ bmc_redfish_timeout }}"
    validate_certs: "{{ bmc_redfish_validate_certs }}"
    ca_path: "{{ bmc_redfish_ca_path | default(omit) if bmc_redfish_ca_path | length > 0 else omit }}"
  register: bmc_rf_service
  failed_when: false
  changed_when: false
  no_log: true
  tags:
    - audit
    - bmc
    - readonly

