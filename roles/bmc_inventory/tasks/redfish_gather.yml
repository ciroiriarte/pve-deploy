- name: Discover raw Redfish system collection.
  ansible.builtin.uri:
    url: "{{ bmc_redfish_scheme }}://{{ ansible_host }}{{ bmc_inventory_systems_path }}"
    method: GET
    url_username: "{{ bmc_username }}"
    url_password: "{{ bmc_password }}"
    force_basic_auth: true
    validate_certs: "{{ bmc_redfish_validate_certs }}"
    ca_path: "{{ bmc_redfish_ca_path | default(omit) if bmc_redfish_ca_path | length > 0 else omit }}"
    timeout: "{{ bmc_redfish_timeout }}"
    headers:
      Accept: "application/json"
    return_content: true
  register: bmc_raw_systems
  failed_when: false
  changed_when: false
  no_log: true
  tags:
    - audit
    - bmc
    - readonly

- name: Select first raw Redfish system member URI.
  ansible.builtin.set_fact:
    bmc_raw_system_uri: "{{ (bmc_raw_systems.json.Members | default([]) | first)['@odata.id'] | default('') }}"
  changed_when: false
  tags:
    - audit
    - bmc
    - readonly

# Needs verification against live Lenovo XCC: SR655 V3/SR665 V3/SR630 V4 may expose
# useful slot/adapter hints only in the ComputerSystem member payload.
- name: Gather raw Redfish system member details.
  ansible.builtin.uri:
    url: "{{ bmc_redfish_scheme }}://{{ ansible_host }}{{ bmc_raw_system_uri }}"
    method: GET
    url_username: "{{ bmc_username }}"
    url_password: "{{ bmc_password }}"
    force_basic_auth: true
    validate_certs: "{{ bmc_redfish_validate_certs }}"
    ca_path: "{{ bmc_redfish_ca_path | default(omit) if bmc_redfish_ca_path | length > 0 else omit }}"
    timeout: "{{ bmc_redfish_timeout }}"
    headers:
      Accept: "application/json"
    return_content: true
  when: bmc_raw_system_uri | length > 0
  register: bmc_raw_system
  failed_when: false
  changed_when: false
  no_log: true
  tags:
    - audit
    - bmc
    - readonly

# Needs verification against live Lenovo XCC: adapter/slot correlation for ConnectX-6
# may be richer under EthernetInterfaces than community.general.GetNicInventory.
- name: Discover raw Redfish host Ethernet interface collection.
  ansible.builtin.uri:
    url: "{{ bmc_redfish_scheme }}://{{ ansible_host }}{{ bmc_raw_system_uri }}/EthernetInterfaces"
    method: GET
    url_username: "{{ bmc_username }}"
    url_password: "{{ bmc_password }}"
    force_basic_auth: true
    validate_certs: "{{ bmc_redfish_validate_certs }}"
    ca_path: "{{ bmc_redfish_ca_path | default(omit) if bmc_redfish_ca_path | length > 0 else omit }}"
    timeout: "{{ bmc_redfish_timeout }}"
    headers:
      Accept: "application/json"
    return_content: true
  when: bmc_raw_system_uri | length > 0
  register: bmc_raw_host_ethernet_collection
  failed_when: false
  changed_when: false
  no_log: true
  tags:
    - audit
    - bmc
    - readonly

- name: Gather raw Redfish host Ethernet interface members.
  ansible.builtin.uri:
    url: "{{ bmc_redfish_scheme }}://{{ ansible_host }}{{ item['@odata.id'] }}"
    method: GET
    url_username: "{{ bmc_username }}"
    url_password: "{{ bmc_password }}"
    force_basic_auth: true
    validate_certs: "{{ bmc_redfish_validate_certs }}"
    ca_path: "{{ bmc_redfish_ca_path | default(omit) if bmc_redfish_ca_path | length > 0 else omit }}"
    timeout: "{{ bmc_redfish_timeout }}"
    headers:
      Accept: "application/json"
    return_content: true
  loop: "{{ bmc_raw_host_ethernet_collection.json.Members | default([]) }}"
  loop_control:
    label: "{{ item['@odata.id'] | default('unknown') }}"
  register: bmc_raw_host_ethernet
  failed_when: false
  changed_when: false
  no_log: true
  tags:
    - audit
    - bmc
    - readonly

