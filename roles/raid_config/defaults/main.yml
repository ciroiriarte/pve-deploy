---
# Default variables for raid_config role

# Audit mode flag: MUST default to true. ZERO writes to BMC or RAID controller.
raid_config_audit_only: true

# Second key, on top of raid_config_audit_only, for operations that destroy
# data: deleting a volume, or reconfiguring a controller that already carries
# one. Creating a volume on unconfigured drives and wiping a populated array are
# not the same decision, and the drive state alone does not convey an operator's
# intent. Set from hardware_allow_destructive_storage by playbooks/01-hardware.yml.
raid_config_allow_destructive: false

# BMC connection defaults.
# bmc_password is deliberately NOT defaulted: an empty default would satisfy an
# "is defined" assertion and turn a missing vault into a confusing auth failure
# against every BMC. Supply it from group_vars/bmc/vault.yml.
bmc_username: "USERID"
bmc_validate_certs: false
bmc_timeout: 30

# Deployment tier stamped into report metadata. Names the tier, not a path.
environment_name: "production"

# Directory name under environments/ holding this site's evidence.
pve_site_name: "default"

# Repository root, resolved from the playbook location rather than the caller's
# working directory, so the tools are found no matter where ansible-playbook
# was invoked from.
pve_deploy_root: "{{ (playbook_dir ~ '/..') | realpath }}"

# Site data root: where per-deployment records are written. Defaults to this
# checkout; point it at a site repository to keep records out of the tool repo.
pve_site_root: "{{ pve_deploy_root }}"

# Evidence and report directories on the control node
evidence_dir: "{{ pve_site_root }}/environments/{{ pve_site_name }}/evidence"
reports_dir: "{{ pve_site_root }}/reports"

# Audit result state.
#
# Defined here, not only in the task files, because the rescue path renders the
# same evidence and report templates without having run the audit. Initialising
# them solely on the success path makes the error handler itself fail on an
# undefined variable, which masks the original error.
raid_audit_outcome: "failed"
storage_controllers: []
physical_drives: []
virtual_disks: []
ceph_osd_candidates: []
ceph_raid0_findings: []
boot_device_confident: false
boot_device_identifiers: []
boot_disk_redundancy: "unknown"
boot_device_evidence: "none"

# Conservative boot-device identification patterns (Python regex, case-insensitive).
#
# Word-anchored on purpose. A bare substring match on "OS" also matches a volume
# named OSD1 or OS_DATA, which would exclude the wrong device from the Ceph
# candidate list and leave the real boot device eligible for destruction.
boot_volume_name_pattern: "(?i)\\b(boot|os|system|vd_boot)\\b"

# Media that identifies itself as M.2. Slot position is deliberately not used as
# evidence: Ceph data drives can occupy low slot numbers on these chassis.
boot_media_name_pattern: "(?i)m\\.?2"
