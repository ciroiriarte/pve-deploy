---
- name: Set timestamp for storage evidence document
  ansible.builtin.set_fact:
    stamp: "{{ lookup('pipe', 'date +%Y-%m-%dT%H%M') }}"
  changed_when: false

- name: Ensure evidence and report directories exist on control node
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  loop:
    - "{{ evidence_dir }}"
    - "{{ reports_dir }}"
  changed_when: false

- name: Render JSON storage evidence document on control node
  ansible.builtin.template:
    src: raid_evidence.json.j2
    dest: "{{ evidence_dir }}/{{ parent_host }}-storage-{{ stamp }}.json"
    mode: "0644"
  delegate_to: localhost
  changed_when: false

- name: Render Markdown storage summary report on control node
  ansible.builtin.template:
    src: raid_report.md.j2
    dest: "{{ reports_dir }}/{{ parent_host }}-raid-summary.md"
    mode: "0644"
  delegate_to: localhost
  changed_when: false

- name: Render Storage Assessment JSON payload on control node
  ansible.builtin.template:
    src: raid_report_payload.json.j2
    dest: "{{ reports_dir }}/{{ parent_host }}-storage-assessment.json"
    mode: "0644"
  delegate_to: localhost
  changed_when: false

- name: Emit storage assessment report via tools/report.py
  # ansible.builtin.command takes "cmd" (or free-form/argv); there is no
  # "command" parameter. chdir anchors the relative tools/ path to the repo root.
  ansible.builtin.command:
    cmd: >-
      python3 tools/report.py render
      {{ reports_dir }}/{{ parent_host }}-storage-assessment.json
      --out {{ reports_dir }}/
      --force
    chdir: "{{ pve_deploy_root }}"
  delegate_to: localhost
  register: raid_report_render
  # Not blanket-suppressed: a swallowed failure here means the mandated report
  # silently never gets written and nobody notices.
  failed_when: raid_report_render.rc != 0
  changed_when: false
