---
- name: Reconcile the Ceph cluster into its intended shape (Phase C/D).
  tags:
    - ceph_reconcile
    - phase16
  block:
    - name: Initialize Ceph reconcile role state.
      ansible.builtin.set_fact:
        pve_ceph_reconcile_outcome: "success"
        pve_ceph_reconcile_verification: []
      run_once: true
      changed_when: false

    - name: Assert the reconcile inputs are present.
      ansible.builtin.assert:
        that:
          - pve_ceph_first_node | length > 0
          - pve_ceph_mon_nodes | length >= 1
          - pve_ceph_crush_rule | length > 0
          - pve_ceph_device_class | length > 0
        fail_msg: "pve_ceph_reconcile needs a first node, mon nodes, a CRUSH rule name and a device class."
        quiet: true
      run_once: true
      changed_when: false

    - name: Reclass OSDs and create the class-scoped CRUSH rule (C1).
      ansible.builtin.include_tasks: device_class.yml
      run_once: true

    - name: Apply autotuning knobs (C2).
      ansible.builtin.include_tasks: tuning.yml
      run_once: true

    - name: Create the production pools (C5/C6).
      ansible.builtin.include_tasks: pools.yml
      run_once: true

    - name: Create MDS and CephFS (D1/D2).
      ansible.builtin.include_tasks: cephfs.yml
      run_once: true

    - name: Collect reconcile verification facts.
      ansible.builtin.include_tasks: verify.yml
      run_once: true

    - name: Render Ceph reconcile report payload.
      ansible.builtin.template:
        src: ceph_reconcile_report_payload.json.j2
        dest: "{{ reports_dir }}/ceph-reconcile-change.json"
        mode: "0644"
      delegate_to: localhost
      run_once: true
      changed_when: false

    - name: Emit Ceph reconcile report via tools/report.py.
      ansible.builtin.command:
        cmd: >-
          python3 tools/report.py render
          {{ reports_dir }}/ceph-reconcile-change.json
          --out {{ reports_dir }}/
          --force
        chdir: "{{ pve_deploy_root }}"
      delegate_to: localhost
      run_once: true
      register: pve_ceph_reconcile_report_render
      failed_when: pve_ceph_reconcile_report_render.rc != 0
      changed_when: false

  rescue:
    - name: Mark Ceph reconcile as failed for reporting.
      ansible.builtin.set_fact:
        pve_ceph_reconcile_outcome: "failed"
        pve_ceph_reconcile_failure_reason: "{{ ansible_failed_result.msg | default('pve_ceph_reconcile role failed') }}"
      run_once: true
      changed_when: false

    - name: Render Ceph reconcile failure report payload.
      ansible.builtin.template:
        src: ceph_reconcile_report_payload.json.j2
        dest: "{{ reports_dir }}/ceph-reconcile-change.json"
        mode: "0644"
      delegate_to: localhost
      run_once: true
      changed_when: false

    - name: Emit Ceph reconcile failure report via tools/report.py.
      ansible.builtin.command:
        cmd: >-
          python3 tools/report.py render
          {{ reports_dir }}/ceph-reconcile-change.json
          --out {{ reports_dir }}/
          --force
        chdir: "{{ pve_deploy_root }}"
      delegate_to: localhost
      run_once: true
      register: pve_ceph_reconcile_failure_render
      failed_when: pve_ceph_reconcile_failure_render.rc != 0
      changed_when: false

    - name: Fail after Ceph reconcile rescue reporting.
      ansible.builtin.fail:
        msg: "{{ pve_ceph_reconcile_failure_reason }}"
      run_once: true
