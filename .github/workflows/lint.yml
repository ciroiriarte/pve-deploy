---
name: Linting & Quality Assurance

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint proxmoxer

      - name: Install Galaxy Collections
        run: |
          ansible-galaxy collection install -r requirements.yml

      - name: Run Ansible Lint
        run: |
          ansible-lint playbooks/

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yamllint
        run: |
          pip install yamllint

      - name: Run yamllint
        run: |
          yamllint -s .

  python-lint:
    name: Python Tools Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: |
          pip install ruff

      - name: Run Ruff Linter
        run: |
          ruff check tools/

      - name: Compile Python Scripts
        run: |
          python3 -m compileall tools/
