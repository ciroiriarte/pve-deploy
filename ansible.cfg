[defaults]
# No default inventory is set on purpose. This repo is multi-environment
# (inventories/<env>/), so an implicit default would make it easy to run a
# playbook against the wrong site. Always pass it explicitly:
#   ansible-playbook -i inventories/example/hosts.yml playbooks/01-hardware.yml
# inventory = inventories/example/hosts.yml

# Location of Ansible roles
roles_path = roles

# Reject unknown host keys. Nodes are enrolled once during the install phase;
# after that a changed key means something is wrong and the run should stop.
# First contact is handled by StrictHostKeyChecking=accept-new in ssh_args
# below, which records the key on first connection but refuses a changed one.
host_key_checking = True

# Readable diffs and task output for interactive and CI runs alike.
# NOT "stdout_callback = yaml": that resolves to community.general.yaml, which
# was removed in community.general 12.0.0. The supported form since
# ansible-core 2.13 is the default callback with result_format=yaml.
stdout_callback = default
result_format = yaml

# Fact caching keeps multi-phase runs fast; the cache lives outside the repo
# tree so it is never committed.
fact_caching = jsonfile
fact_caching_connection = ~/.cache/pve-deploy/facts
fact_caching_timeout = 86400

# Keep the repository root clean
retry_files_enabled = False

# A deployment is typically 3-8 nodes; 20 leaves headroom without flooding
# the BMCs during Tier A fan-out.
forks = 20

# Targets are Debian with a predictable interpreter; silence discovery noise
interpreter_python = auto_silent

[privilege_escalation]
# Deliberately NOT enabled globally.
#
# Proxmox VE nodes are administered as root over SSH, so become/sudo is both
# unnecessary and a failure mode: a stock PVE install has no sudo rule for a
# non-root deploy account, and Tier A plays run with connection: local against
# BMC endpoints where privilege escalation is meaningless.
#
# Where a specific task genuinely needs it, set become at the task or play
# level rather than turning it on for everything.
become = False

[ssh_connection]
# Pipelining removes a round trip per task. Safe here because the targets do
# not use requiretty.
pipelining = True

# Persistent multiplexed connections. accept-new records a host key on first
# contact but still refuses a key that has changed.
# ServerAliveInterval/CountMax are not tuning -- they are what turns a dead
# connection into an error instead of an indefinite hang.
#
# Without them, an SSH transport that dies mid-task (an operator VPN dropping,
# a route flapping) leaves ansible blocked on a socket that will never answer.
# It does not fail, so it never becomes "unreachable", so ignore_unreachable
# and any_errors_fatal never see it and no later play runs. A phase 13 run sat
# wedged for two hours this way: no client process on any node, netserver left
# running on two of them, and zero unreachable events recorded.
#
# 15s x 4 declares the peer dead in about a minute, which surfaces as
# unreachable and lets the playbook's own handling take over.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=4

# NOTE: do not add scp_if_ssh here. It was removed from ansible-core; the
# modern equivalent is transfer_method, and the default (sftp with scp
# fallback) is correct for these targets.
